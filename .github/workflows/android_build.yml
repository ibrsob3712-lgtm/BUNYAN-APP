name: BUNYAN Android Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Remove old Android platform
        run: rm -rf android

      - name: Create modern Android platform
        run: flutter create --platforms=android .

      - name: Update Android compile SDK to 36
        run: |
          sed -i -E 's/compileSdk = [^[:space:]]+/compileSdk = 36/' android/app/build.gradle.kts
          sed -i -E 's/targetSdk = [^[:space:]]+/targetSdk = 36/' android/app/build.gradle.kts

          echo "Current Android configuration:"
          grep -E "compileSdk|targetSdk|minSdk" android/app/build.gradle.kts

      - name: Remove obsolete Flutter test
        run: rm -f test/widget_test.dart

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BUNYAN-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
