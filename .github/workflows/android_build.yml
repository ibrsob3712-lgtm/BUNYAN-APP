name: BUNYAN Android Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Remove old Android platform
        run: rm -rf android

      - name: Create modern Android platform
        run: flutter create --platforms=android .

      - name: Get dependencies
        run: flutter pub get

      - name: Remove obsolete Flutter test
        run: rm -f test/widget_test.dart

      - name: Update application compile SDK
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i -E 's/compileSdk = [^[:space:]]+/compileSdk = 36/' android/app/build.gradle.kts
            sed -i -E 's/targetSdk = [^[:space:]]+/targetSdk = 36/' android/app/build.gradle.kts
          fi

          echo "Application Android configuration:"
          grep -E "compileSdk|targetSdk|minSdk" android/app/build.gradle.kts || true

      - name: Update file_picker compile SDK
        run: |
          echo "Searching for file_picker Android Gradle files..."

          find "$HOME/.pub-cache" \
            -path "*file_picker*/android/build.gradle" \
            -o \
            -path "*file_picker*/android/build.gradle.kts"

          find "$HOME/.pub-cache" \
            -path "*file_picker*/android/build.gradle" \
            -exec sed -i -E \
            's/compileSdkVersion[[:space:]]+34/compileSdkVersion 36/g' {} \;

          find "$HOME/.pub-cache" \
            -path "*file_picker*/android/build.gradle.kts" \
            -exec sed -i -E \
            's/compileSdk[[:space:]]*=[[:space:]]*34/compileSdk = 36/g' {} \;

          echo "Checking file_picker configuration:"
          find "$HOME/.pub-cache" \
            -path "*file_picker*/android/build.gradle*" \
            -exec grep -H -E "compileSdk|compileSdkVersion" {} \; || true

      - name: Analyze project
        run: flutter analyze

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BUNYAN-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
