name: bunyan
description: Professional offline-first platform for documenting inspections and supporting assessment of existing buildings.
publish_to: "none"
version: 1.2.0+4

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  image_picker: ^1.1.2
  uuid: ^4.5.1
  pdf: ^3.11.1
  printing: ^5.13.4
  share_plus: ^10.1.4
  permission_handler: ^11.3.1
  file_picker: ^11.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
